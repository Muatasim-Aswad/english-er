name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_check.py "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish source-only release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json targetCommitish,body,isDraft > "$RUNNER_TEMP/existing-release.json"
            python3 - "$RUNNER_TEMP/existing-release.json" "$RUNNER_TEMP/release-notes.md" <<'PYTHON'
          import json, os, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = pathlib.Path(sys.argv[2]).read_text().strip()
          if release["targetCommitish"] != os.environ["GITHUB_SHA"] or release["body"].strip() != expected:
              raise SystemExit("Existing release differs from the verified tag or notes; inspect it without moving the tag")
          PYTHON
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == false ]]; then
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false
